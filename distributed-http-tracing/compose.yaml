services:
  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    ports:
      - "127.0.0.1::8082"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8082"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      PAYMENT_URL: http://payment-service:8082/payments
    ports:
      - "127.0.0.1::8081"
    depends_on:
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8081"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
